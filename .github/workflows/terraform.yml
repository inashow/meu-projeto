name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply (somente na branch main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Smoke test (verificação pós-deploy)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sleep 5
          docker ps
          curl -fsS http://localhost:8081 | grep -F "Atualizado via pipeline"

      - name: Teste de persistencia do banco - Lab2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          for tentativa in $(seq 1 30); do
            if docker exec meu-container-db pg_isready -U postgres; then
              break
            fi
            sleep 2
          done

          docker exec meu-container-db psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS teste_persistencia (texto TEXT);"

          echo "ANTES de inserir nesta execucao:"
          docker exec meu-container-db psql -U postgres -v ON_ERROR_STOP=1 -c "SELECT * FROM teste_persistencia;"

          docker exec meu-container-db psql -U postgres -v ON_ERROR_STOP=1 -c "INSERT INTO teste_persistencia VALUES ('Mensagem criada pela pipeline');"

          echo "DEPOIS de inserir nesta execucao:"
          docker exec meu-container-db psql -U postgres -v ON_ERROR_STOP=1 -c "SELECT * FROM teste_persistencia;"
